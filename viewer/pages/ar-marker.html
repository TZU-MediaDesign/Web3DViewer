<!-- boot.js が各モデルのページの <body> に挿入する断片です（単体では開きません） -->
<a-scene
    id="scene"
    vr-mode-ui="enabled: false"
    renderer="colorManagement: true; antialias: true"
    embedded
    arjs="sourceType: webcam; detectionMode: mono_and_matrix; matrixCodeType: 3x3; debugUIEnabled: false;">

    <a-assets></a-assets>

    <a-marker id="marker" preset="hiro">
        <a-entity id="ar-model"></a-entity>
    </a-marker>

    <a-entity camera></a-entity>
</a-scene>

<!-- 画面上部：マーカー未検出時の案内 -->
<div id="ar-hint">
    <div id="ar-hint-text">マーカーにカメラを向けてください</div>
</div>

<!-- 右下：モード切り替え／戻るボタン -->
<div id="ar-btn-group">
    <a id="switch-image-btn" href="#" title="画像ARに切り替え" style="display:none">
        <svg viewBox="0 0 24 24"><path d="M4 5h16v14H4V5zm2 2v10h12V7H6zm2 2h3v3H8V9zm5.5 6.5 2-2.5 2 3H10l2.5-3 1 1.5z" fill="#fff"/></svg>
        <span class="ar-btn-label">画像</span>
    </a>
    <a id="back-btn" href="#" title="通常ビューアに戻る">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="ar-btn-label">戻る</span>
    </a>
</div>
