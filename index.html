<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Model Viewer</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #12181f;
            color: #e8edf2;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
        }
        main { width: 100%; max-width: 560px; padding: 48px 20px; box-sizing: border-box; }
        h1 { font-size: 18px; font-weight: 600; letter-spacing: 0.05em; margin: 0 0 24px; }
        ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
        a {
            display: block;
            padding: 16px 18px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.07);
            color: inherit;
            text-decoration: none;
        }
        a:hover { background: rgba(255, 255, 255, 0.14); }
        .name { font-size: 15px; }
        .path { font-size: 12px; opacity: 0.6; margin-top: 4px; }
        #message { font-size: 14px; opacity: 0.7; }
    </style>
</head>
<body>
    <main>
        <h1>3D Model Viewer</h1>
        <ul id="list"></ul>
        <p id="message"></p>
    </main>

    <script>
        // models.json に並べたモデルのフォルダを一覧表示する。
        // モデルが1つだけの場合は、一覧を挟まずそのモデルのページへ移動する。
        (async function () {
            // 表示を固定中のタブ（viewer/lock.js）では、固定したページへ戻す
            try {
                const lock = JSON.parse(sessionStorage.getItem('w3dv-lock'));
                if (lock) { location.replace(lock.url); return; }
            } catch (e) { /* 固定されていない */ }

            const list = document.getElementById('list');
            const message = document.getElementById('message');
            try {
                const { models } = await (await fetch('models.json', { cache: 'no-cache' })).json();
                if (models.length === 1) { location.replace(models[0] + '/'); return; }
                if (!models.length) { message.textContent = 'モデルが登録されていません。'; return; }

                for (const id of models) {
                    let title = id;
                    try {
                        const cfg = await (await fetch(`${id}/config.json`, { cache: 'no-cache' })).json();
                        if (cfg.displayTitle && cfg.displayTitle.length) title = cfg.displayTitle.join(' ');
                        else if (cfg.pageTitle) title = cfg.pageTitle;
                    } catch (e) { /* 設定が読めないモデルはフォルダ名で表示する */ }

                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    a.href = id + '/';
                    const name = document.createElement('div');
                    name.className = 'name';
                    name.textContent = title;
                    const path = document.createElement('div');
                    path.className = 'path';
                    path.textContent = id + '/';
                    a.append(name, path);
                    li.appendChild(a);
                    list.appendChild(li);
                }
            } catch (e) {
                message.textContent = 'モデルの一覧（models.json）を読み込めませんでした。';
            }
        })();
    </script>
</body>
</html>
